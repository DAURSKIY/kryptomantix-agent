name: Kryptomantix Agent

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем права на запись в репозиторий, чтобы сохранять память

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
        run: python agent.py

      # Вот тут мы сохраняем память прямо в репозиторий
      - name: Commit state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add agent_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update agent state [skip ci]" && git push)
